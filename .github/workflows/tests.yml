name: Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: unittest on windows-latest / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The engine, classifier and dashboard use the standard library; the tray icon and
      # Outlook checking need these. The paired-iPhone tools need real hardware and are not run.
      - name: Install runtime dependencies
        run: python -m pip install pystray==0.19.5 Pillow==10.4.0 pywin32==312

      - name: Run the test suite
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
