name: Release

# Builds PrivacyProtector.exe and its installer from this repository, on GitHub's own runner,
# whenever a version tag is pushed, and attaches both to the GitHub release. Pushes to a release
# branch build the same files as a workflow artifact only, to check the build before tagging.
on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Empty until SignPath approves the project and its keys are saved as repository secrets;
      # while empty, the signing steps are skipped.
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.2

      - name: Run the test suite
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests

      - name: Build PrivacyProtector.exe
        run: python -m PyInstaller packaging/PrivacyProtector.spec --noconfirm

      # Code signing through SignPath Foundation: runs once the project's SignPath organization id and
      # API token are saved as repository secrets. The unsigned exe goes to SignPath and comes back signed.
      - name: Upload the exe for signing
        id: unsigned
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/PrivacyProtector/PrivacyProtector.exe

      - name: Sign PrivacyProtector.exe
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: privacy-protector
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Use the signed exe
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: Copy-Item dist\signed\PrivacyProtector.exe dist\PrivacyProtector\PrivacyProtector.exe -Force

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          choco install innosetup --no-progress -y | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\PrivacyProtector.iss
          Compress-Archive -Path dist\PrivacyProtector\* -DestinationPath "dist\PrivacyProtector-$version-portable.zip"

      - name: Upload the installer for signing
        id: unsigned-setup
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/PrivacyProtector-Setup-*.exe

      - name: Sign the installer
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: privacy-protector
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-setup

      - name: Use the signed installer and write the checksums
        shell: pwsh
        run: |
          if (Test-Path dist\signed-setup) { Copy-Item dist\signed-setup\*.exe dist\ -Force }
          Get-FileHash dist\*.exe, dist\*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: privacy-protector
          path: |
            dist/PrivacyProtector-Setup-*.exe
            dist/PrivacyProtector-*-portable.zip
            dist/SHA256SUMS.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Privacy Protector $tag" --notes "Release $tag" }
          gh release upload $tag (Get-ChildItem dist\PrivacyProtector-Setup-*.exe).FullName (Get-ChildItem dist\*-portable.zip).FullName dist\SHA256SUMS.txt --clobber
