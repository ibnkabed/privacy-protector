# Installs a release on a clean Windows machine, upgrades it to a newer one, and uninstalls it. Run by hand.
name: Installer test

on:
  workflow_dispatch:
    inputs:
      from:
        description: Tag to install first
        default: v2.0.0
      to:
        description: Tag to upgrade to
        default: v2.1.1

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the installers
        shell: pwsh
        run: |
          gh release download ${{ inputs.from }} --repo ${{ github.repository }} -p "PrivacyProtector-Setup-*.exe" -D old
          gh release download ${{ inputs.to }} --repo ${{ github.repository }} -p "PrivacyProtector-Setup-*.exe" -D new

      - name: Install, change a setting, upgrade, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Exe = Join-Path $env:ProgramFiles "Privacy Protector Open Source\PrivacyProtector.exe"
          $Base = "http://127.0.0.1:8733"
          function Install($Dir) {
            $Setup = (Get-ChildItem $Dir -Filter *.exe).FullName
            $P = Start-Process $Setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
            if ($P.ExitCode -ne 0) { throw "Setup failed with $($P.ExitCode)" }
          }
          function WaitHealth {
            foreach ($i in 1..30) {
              try { if ((Invoke-RestMethod "$Base/api/health" -TimeoutSec 3).ok) { return } } catch {}
              Start-Sleep -Seconds 1
            }
            "No answer. Processes:"
            Get-Process PrivacyProtector -ErrorAction SilentlyContinue | Format-Table Id, StartTime | Out-String
            "Listening on 8733:"
            Get-NetTCPConnection -LocalPort 8733 -ErrorAction SilentlyContinue | Out-String
            Get-Process PrivacyProtector -ErrorAction SilentlyContinue | Stop-Process -Force
            $P = Start-Process $Exe -ArgumentList "--engine", "--no-tray" -WorkingDirectory (Split-Path $Exe) -PassThru `
              -RedirectStandardError engine.err -RedirectStandardOutput engine.out
            Start-Sleep -Seconds 25
            "Engine exited: $($P.HasExited)"
            Get-Content engine.err, engine.out -ErrorAction SilentlyContinue | Select-Object -Last 40
            try { "Direct health: $(Invoke-WebRequest "$Base/api/health" -UseBasicParsing -TimeoutSec 5 | Select-Object -Expand Content)" } catch { "Direct health failed: $_" }
            throw "The engine did not answer"
          }
          function Registered {
            Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq "Privacy Protector" }
          }

          function Uninstall {
            $Uninstaller = Join-Path (Split-Path $Exe) "unins000.exe"
            $P = Start-Process $Uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
            "Uninstall exit: $($P.ExitCode)"
            Start-Sleep -Seconds 10
            if (Registered) { throw "Still registered after uninstall" }
            if (Test-Path $Exe) { throw "The program is still on disk" }
            if (Get-Process PrivacyProtector -ErrorAction SilentlyContinue) { throw "The engine is still running" }
          }
          $DataDir = Join-Path $env:LOCALAPPDATA "PrivacyProtector\data"

          # A new user: nothing on the machine yet.
          "--- New install"
          Install new
          Start-Process $Exe -ArgumentList "--background"
          WaitHealth
          "New install answers"
          Uninstall
          Remove-Item (Split-Path $DataDir) -Recurse -Force -ErrorAction SilentlyContinue

          # An existing user. The data folder is made first, because 2.0 and 2.1.0 could not start without one.
          "--- Upgrade"
          New-Item -ItemType Directory -Force $DataDir | Out-Null
          Install old
          "Installed: $((Registered).DisplayVersion)"
          Start-Process $Exe -ArgumentList "--background"
          WaitHealth
          Get-Process PrivacyProtector -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $File = Join-Path $env:LOCALAPPDATA "PrivacyProtector\data\settings.json"
          $Saved = Get-Content $File -Raw | ConvertFrom-Json
          $Saved.firstRunDone = $true
          $Saved.language = "ar"
          $Saved | ConvertTo-Json -Depth 5 | Set-Content $File -Encoding utf8
          Start-Process $Exe -ArgumentList "--background"
          WaitHealth

          # The upgrade runs while the old engine is still running, as it would for a user.
          Install new
          $Version = (Registered).DisplayVersion
          "Upgraded: $Version"
          if ("v$Version" -ne "${{ inputs.to }}") { throw "Wrong version after the upgrade: $Version" }
          Get-Process PrivacyProtector -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Start-Process $Exe -ArgumentList "--background"
          WaitHealth
          $Settings = (Invoke-RestMethod "$Base/api/settings").settings
          "After upgrade: language=$($Settings.language) firstRunDone=$($Settings.firstRunDone) trackerLists=$($Settings.trackerLists)"
          if ($Settings.language -ne "ar" -or -not $Settings.firstRunDone) { throw "The upgrade lost the saved settings" }
          foreach ($Path in "/", "/api/status", "/api/apps", "/api/pc/status") {
            "$Path $((Invoke-WebRequest "$Base$Path" -UseBasicParsing).StatusCode)"
          }

          Uninstall
          "Data kept: $(Test-Path (Join-Path $env:LOCALAPPDATA 'PrivacyProtector\data\settings.json'))"
