name: Bug report
description: Something in Privacy Protector does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real data.** Activity logs, policy files, captures, App Privacy
        Report rows, and screenshots of the dashboard are a durable inventory of your
        own devices and services. Use synthetic hostnames such as `example.test`, or
        describe the shape of the problem instead of attaching the evidence.

        For a security vulnerability, do not open an issue. Follow `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Prefer the test launcher on DNS port `53053` over a live iPhone setup.
      placeholder: |
        1. Run .\Start-Privacy-Protector.ps1
        2. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - DNS engine (blocking, caching, forwarding, self-test)
        - Domain classification (green / orange / red, study, confidence)
        - Dashboard interface
        - Local API
        - Launchers, firewall preparation, or Windows startup
        - Paired-iPhone features (inventory, Developer Mode, capture, attribution)
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v1.0.0, or the commit you are running"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Windows and Python version
      placeholder: "Windows 11 24H2, Python 3.12.10, PowerShell 7.4"
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This report contains no real hostnames, bundle identifiers, local IP addresses, or capture output.
          required: true
